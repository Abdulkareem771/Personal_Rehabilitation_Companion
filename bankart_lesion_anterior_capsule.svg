<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="socketGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="30" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Bankart Lesion &amp; Joint Stability</text>
  <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Anterior-inferior glenoid labrum avulsion and dynamic compensation forces</text>

  <!-- Scapular Glenoid Neck outline -->
  <path d="M 120 225 C 120 120, 200 130, 240 130 C 280 130, 310 160, 310 225 C 310 290, 280 320, 240 320 C 200 320, 120 330, 120 225 Z" fill="#1e293b" stroke="#475569" stroke-width="3" />

  <!-- Glenoid Fossa (Socket) -->
  <ellipse cx="250" cy="225" rx="50" ry="80" fill="url(#socketGrad)" stroke="#64748b" stroke-width="2" />
  <text x="215" y="228" fill="#475569" font-family="system-ui, sans-serif" font-weight="extrabold" font-size="11">GLENOID FOSSA</text>

  <!-- Labrum Rim (Normally intact outer ring) -->
  <path d="M 250 145 A 50 80 0 1 1 250 305 A 50 80 0 1 1 250 145" fill="none" stroke="#94a3b8" stroke-width="8" opacity="0.6" />

  <!-- Bankart Lesion Tear Zone (Anterior-Inferior, roughly 3 to 6 o'clock on right shoulder) -->
  <!-- We'll draw a torn, red avulsed area at the bottom-right of the socket -->
  <path d="M 275 270 Q 295 285 280 300 Q 260 295 265 275" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
  
  <!-- Red alert highlighting lesion -->
  <circle cx="282" cy="285" r="18" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3" />
  
  <!-- Pointer lines and labels -->
  <path d="M 295 295 L 360 340 L 400 340" fill="none" stroke="#f43f5e" stroke-width="2" />
  <text x="410" y="344" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="black" font-size="12">BANKART TEAR</text>
  <text x="410" y="360" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">(Anterior-Inferior Labrum Avulsion)</text>

  <!-- Dynamic Posterior Stabilizers Indicator (Infraspinatus & Teres Minor) -->
  <!-- These muscles contract to pull the humeral head posteriorly (to the left in this view) -->
  <g transform="translate(100, 225)">
    <!-- Muscle force vector arrow -->
    <path d="M 120 0 L 10 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="0" marker-end="url(#arrow)" />
    <!-- Arrowhead -->
    <path d="M 15 -6 L 5 0 L 15 6 Z" fill="#38bdf8" />
    <text x="20" y="-12" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="black" font-size="12">DYNAMIC STABILIZATION</text>
    <text x="20" y="8" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Posterior Rotator Cuff Pulls</text>
    <text x="20" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Humeral Head Back into Socket</text>
  </g>

  <!-- Clinical Advice Box -->
  <rect x="30" y="340" width="310" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="50" y="365" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Rehab Objective:</text>
  <text x="50" y="385" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Strengthen infraspinatus / teres minor to</text>
  <text x="50" y="402" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">prevent anterior subluxation over torn labrum.</text>

</svg>
