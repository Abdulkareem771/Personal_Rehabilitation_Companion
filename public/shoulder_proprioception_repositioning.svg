<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="30" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Shoulder Kinesthesia &amp; Proprioception</text>
  <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Rebuilding joint position sense and neurological mechanoreceptor feedback loop post-injury</text>

  <!-- Joint representation -->
  <circle cx="200" cy="230" r="40" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Capsule shell representing ligament mechanoreceptors -->
  <circle cx="200" cy="230" r="48" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="8,4" />

  <!-- Labeled mechanoreceptor nodes on capsule -->
  <circle cx="160" cy="200" r="5" fill="#38bdf8" />
  <circle cx="240" cy="260" r="5" fill="#38bdf8" />
  <circle cx="230" cy="190" r="5" fill="#ef4444" /> <!-- Damaged/Torn labrum receptor -->

  <!-- Feedback loops -->
  <!-- 1. Sensory afferent path (Damaged) -->
  <path d="M 230 190 Q 300 130 400 130" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,2" />
  <path d="M 402 126 L 402 134 L 408 130 Z" fill="#ef4444" />
  <text x="270" y="115" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Disrupted Afferent Signal (Labral Tear)</text>

  <!-- 2. Re-education path (Active learning cues/proprioception) -->
  <path d="M 160 200 Q 250 350 400 350" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 402 346 L 402 354 L 408 350 Z" fill="#22c55e" />
  <text x="230" y="375" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Neuromuscular Calibration Cues</text>

  <!-- Central Nervous System (Spinal/Brain processing representation) -->
  <rect x="410" y="110" width="150" height="260" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="430" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="extrabold" font-size="12">SPINAL/CNS LOGIC</text>
  
  <rect x="430" y="160" width="110" height="70" rx="8" fill="#7f1d1d" opacity="0.6" />
  <text x="440" y="185" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">POSITION ERROR:</text>
  <text x="440" y="200" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Shoulder subluxes</text>
  <text x="440" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9">without reflex guard.</text>

  <rect x="430" y="250" width="110" height="90" rx="8" fill="#14532d" opacity="0.6" />
  <text x="440" y="275" fill="#86efac" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">RE-EDUCATION:</text>
  <text x="440" y="295" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Active tracking</text>
  <text x="440" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9">recalibrates joint</text>
  <text x="440" y="322" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9">position reflexes.</text>

  <!-- Clinical Core Box -->
  <rect x="30" y="340" width="170" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="45" y="365" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Active exercises like</text>
  <text x="45" y="382" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Wall Slides rebuild</text>
  <text x="45" y="399" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">joint location awareness.</text>
</svg>
