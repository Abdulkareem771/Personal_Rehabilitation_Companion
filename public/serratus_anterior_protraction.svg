<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="30" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Serratus Protraction vs. Shrugging</text>
  <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Isolating the serratus anterior to establish scapular stability without trapezius dominance</text>

  <!-- Split line -->
  <line x1="300" y1="110" x2="300" y2="410" stroke="#1e293b" stroke-width="3" />

  <!-- LEFT: CORRECT SERRATUS PROTRACTION -->
  <g transform="translate(0, 0)">
    <!-- Sub-heading -->
    <rect x="50" y="110" width="200" height="28" rx="8" fill="#14532d" />
    <text x="75" y="128" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="black" font-size="12">✅ CORRECT PROTRACTION</text>

    <!-- Ribcage outline representation -->
    <path d="M 60 280 Q 150 320 220 280" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <text x="80" y="325" fill="#475569" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">RIBCAGE</text>

    <!-- Scapula (sliding forward around ribcage) -->
    <path d="M 170 210 L 220 250 L 190 290 Z" fill="#15803d" opacity="0.8" stroke="#22c55e" stroke-width="2" />
    <text x="180" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Scapula</text>

    <!-- Wrap-around arrow showing forward glide -->
    <path d="M 160 270 Q 210 295 240 250" fill="none" stroke="#22c55e" stroke-width="4" />
    <path d="M 242 260 L 243 246 L 230 251 Z" fill="#22c55e" />

    <!-- Serratus Muscle fibers representation -->
    <path d="M 190 285 Q 160 300 130 290" fill="none" stroke="#4ade80" stroke-width="3" />
    <path d="M 185 270 Q 155 285 125 275" fill="none" stroke="#4ade80" stroke-width="3" />
    <path d="M 180 255 Q 150 270 120 260" fill="none" stroke="#4ade80" stroke-width="3" />
    <text x="70" y="240" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Serratus Anterior</text>

    <!-- Clinical Cue text -->
    <text x="50" y="360" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Biomechanical Cue:</text>
    <text x="50" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">"Push your knuckles forward, gliding the</text>
    <text x="50" y="398" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">shoulder blade around your ribcage."</text>
  </g>

  <!-- RIGHT: INCORRECT UPPER TRAP SHRUGGING -->
  <g transform="translate(300, 0)">
    <!-- Sub-heading -->
    <rect x="50" y="110" width="200" height="28" rx="8" fill="#7f1d1d" />
    <text x="75" y="128" fill="#f87171" font-family="system-ui, sans-serif" font-weight="black" font-size="12">❌ INCORRECT SHRUGGING</text>

    <!-- Ribcage representation -->
    <path d="M 60 280 Q 150 320 220 280" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />

    <!-- Scapula (elevated and rotated poorly) -->
    <path d="M 140 170 L 190 210 L 160 250 Z" fill="#b91c1c" opacity="0.8" stroke="#ef4444" stroke-width="2" />
    <text x="110" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Scapula (Elevated)</text>

    <!-- Vertical red arrow showing upward shrugging force -->
    <path d="M 165 240 L 165 130" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="0" />
    <path d="M 159 138 L 165 125 L 171 138 Z" fill="#ef4444" />
    <text x="180" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">UPWARD FORCE</text>

    <!-- Upper Trapezius highlight -->
    <path d="M 140 170 Q 100 120 80 120" fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round" />
    <text x="50" y="100" fill="#f87171" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Dominant Upper Trap</text>

    <!-- Clinical Alert text -->
    <text x="50" y="360" fill="#f87171" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Impingement Hazard:</text>
    <text x="50" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Shrugging compresses the subacromial</text>
    <text x="50" y="398" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">space, pinching rotator cuff tendons.</text>
  </g>
</svg>
