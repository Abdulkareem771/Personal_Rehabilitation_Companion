<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="30" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Dynamic Clearance &amp; Impingement Zone</text>
  <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Why external rotation is biomechanically required during abduction to avoid acromial contact</text>

  <!-- Impingement Zone Arc (60° to 120°) -->
  <!-- We'll draw an orange/red transparent segment representing the danger arc -->
  <path d="M 300 250 L 387 100 A 180 180 0 0 0 213 100 Z" fill="url(#warningGrad)" opacity="0.25" />
  
  <!-- Danger Zone Label -->
  <text x="240" y="160" fill="#f97316" font-family="system-ui, sans-serif" font-weight="black" font-size="13">PAINFUL IMPINGEMENT ZONE</text>
  <text x="275" y="180" fill="#f97316" font-family="monospace" font-weight="extrabold" font-size="12">60° - 120°</text>

  <!-- Acromion Process (top shelf of bone) -->
  <path d="M 230 180 Q 280 180 300 190" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" />
  <text x="180" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Acromion Process</text>

  <!-- Coracoacromial Arch -->
  <path d="M 230 180 Q 250 220 280 230" fill="none" stroke="#475569" stroke-dasharray="2,2" stroke-width="2" />

  <!-- Humeral Head & Greater Tubercle (Rotated internally vs externally) -->
  <!-- Joint socket pivot center -->
  <circle cx="300" cy="250" r="4" fill="#64748b" />

  <!-- Intact Supraspinatus Tendon (running under acromion) -->
  <path d="M 210 205 Q 260 205 295 212" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round" />
  <text x="145" y="218" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Supraspinatus Tendon</text>

  <!-- Greater Tubercle representing rotation force -->
  <g transform="translate(300, 250) rotate(80)">
    <!-- Humeral shaft -->
    <rect x="-10" y="5" width="20" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="22" fill="#334155" stroke="#475569" stroke-width="2" />
    <!-- Greater Tubercle (bone bump) -->
    <path d="M 16 -12 Q 26 0 16 12 Z" fill="#94a3b8" />
    
    <!-- Rotational arrow showing external rotation clearance -->
    <path d="M 28 0 A 28 28 0 0 1 20 20" fill="none" stroke="#22c55e" stroke-width="3" />
    <!-- Arrowhead -->
    <path d="M 24 22 L 14 18 L 22 10 Z" fill="#22c55e" />
    <text x="35" y="25" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="black" font-size="11" transform="rotate(-80)">External Rotation</text>
  </g>

  <!-- Explanatory Sidebar Card -->
  <rect x="360" y="270" width="210" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="300" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">CLEARANCE PATHWAY</text>
  <rect x="380" y="312" width="170" height="2" fill="#334155" />
  
  <text x="380" y="335" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">External rotation rotates the</text>
  <text x="380" y="352" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Greater Tubercle posteriorly.</text>
  
  <text x="380" y="378" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Result: Prevents compression</text>
  <text x="380" y="395" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11">of subacromial tissues.</text>
</svg>
