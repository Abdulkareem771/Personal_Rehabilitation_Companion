<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="30" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Apprehension Position vs. Scapular Plane</text>
  <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Dangerous high-stress positions to avoid vs. the biomechanically safe plane of rehabilitation</text>

  <!-- Split line -->
  <line x1="300" y1="110" x2="300" y2="410" stroke="#1e293b" stroke-width="3" />

  <!-- LEFT: AVOID: APPREHENSION POSITION -->
  <g transform="translate(0, 0)">
    <rect x="50" y="110" width="200" height="28" rx="8" fill="#7f1d1d" />
    <text x="65" y="128" fill="#f87171" font-family="system-ui, sans-serif" font-weight="black" font-size="11">❌ AVOID: APPREHENSION</text>

    <!-- Torso outline -->
    <path d="M 100 350 L 150 250 L 150 200" fill="none" stroke="#334155" stroke-width="4" />

    <!-- Arm in 90/90 high risk posture -->
    <path d="M 150 200 L 250 200 L 250 120" fill="none" stroke="url(#redGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Red warning halo around anterior capsule -->
    <circle cx="160" cy="200" r="15" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    
    <text x="180" y="220" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="black" font-size="11">HIGH ANTERIOR STRESS</text>
    <text x="160" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Combined: 90° Abduction + 90° ER</text>

    <text x="50" y="340" fill="#f87171" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Why Avoid?</text>
    <text x="50" y="360" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Leverage forces push humeral head</text>
    <text x="50" y="378" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">anteriorly, risking subluxation over</text>
    <text x="50" y="396" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">the damaged anterior labral rim.</text>
  </g>

  <!-- RIGHT: SAFE: SCAPULAR PLANE -->
  <g transform="translate(300, 0)">
    <rect x="50" y="110" width="200" height="28" rx="8" fill="#14532d" />
    <text x="65" y="128" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="black" font-size="11">✅ SAFE: SCAPULAR PLANE</text>

    <!-- Torso outline side view / angle -->
    <path d="M 120 350 L 120 220" fill="none" stroke="#334155" stroke-width="4" />

    <!-- Safe Arm path: 30° forward relative to frontal plane -->
    <path d="M 120 220 L 190 170 L 220 100" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" />
    
    <!-- Scapular plane angle arc -->
    <path d="M 160 220 A 40 40 0 0 0 148 180" fill="none" stroke="#22c55e" stroke-width="2" />
    <text x="160" y="195" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="12">30° Plane</text>

    <text x="50" y="340" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Safe Rehabilitation Plane</text>
    <text x="50" y="360" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Aligning arm 30° forward decreases</text>
    <text x="50" y="378" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">cervical tension, reduces anterior</text>
    <text x="50" y="396" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">capsule strain, and isolates cuff.</text>
  </g>
</svg>
