<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="30" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Rotator Cuff Force Couples</text>
  <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Biomechanical force vectors of the four cuff muscles acting as a dynamic compressor</text>

  <!-- Joint Socket & Humeral Head Outline -->
  <ellipse cx="220" cy="240" rx="40" ry="70" fill="#1e293b" stroke="#475569" stroke-width="3" />
  <circle cx="300" cy="240" r="50" fill="#334155" stroke="#64748b" stroke-width="2" />
  
  <!-- Centering force target point -->
  <circle cx="260" cy="240" r="5" fill="#f43f5e" />
  
  <!-- 1. SUPRASPINATUS FORCE VECTOR (Abduction/Compression) -->
  <path d="M 300 190 Q 240 180 180 180" fill="none" stroke="#fb7185" stroke-width="3.5" />
  <path d="M 188 174 L 175 180 L 188 186 Z" fill="#fb7185" />
  <text x="130" y="165" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Supraspinatus (Pull: Superior/Medial)</text>

  <!-- 2. INFRASPINATUS & TERES MINOR (External Rotation/Compression) -->
  <path d="M 320 280 Q 250 310 180 290" fill="none" stroke="#38bdf8" stroke-width="3.5" />
  <path d="M 188 283 L 175 289 L 186 297 Z" fill="#38bdf8" />
  <text x="110" y="325" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Infraspinatus / Teres Minor (Pull: Posterior/Inferior)</text>

  <!-- 3. SUBSCAPULARIS (Internal Rotation/Anterior Guarding) -->
  <path d="M 320 210 Q 280 200 220 220" fill="none" stroke="#22c55e" stroke-width="3.5" />
  <path d="M 226 213 L 215 221 L 228 227 Z" fill="#22c55e" />
  <text x="140" y="105" fill="#22c55e" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Subscapularis (Pull: Anterior/Medial)</text>

  <!-- Dynamic Compression force ring -->
  <circle cx="300" cy="240" r="58" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4" opacity="0.3" />

  <!-- Explanatory Card -->
  <rect x="360" y="270" width="210" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="300" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">CONCENTRIC STABILITY</text>
  <rect x="380" y="312" width="170" height="2" fill="#334155" />
  
  <text x="380" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cuff muscles pull the large</text>
  <text x="380" y="352" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Humeral head inward against</text>
  <text x="380" y="369" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">the small Glenoid socket,</text>
  <text x="380" y="395" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">preventing subluxation.</text>
</svg>
