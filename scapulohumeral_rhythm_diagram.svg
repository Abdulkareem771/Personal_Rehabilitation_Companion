<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  
  <!-- Background panel -->
  <rect width="600" height="450" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Title & Description -->
  <text x="30" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="20">2:1 Scapulohumeral Rhythm</text>
  <text x="30" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Biomechanical ratio of glenohumeral to scapulothoracic elevation</text>
  
  <!-- Spine & Thorax Grid lines -->
  <line x1="120" y1="120" x2="120" y2="400" stroke="#1e293b" stroke-width="4" />
  <line x1="120" y1="180" x2="280" y2="180" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="120" y1="280" x2="280" y2="280" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4" />
  <text x="70" y="260" fill="#475569" font-family="monospace" font-size="10" transform="rotate(-90 70 260)">MIDLINE (SPINE)</text>
  
  <!-- Clavicle -->
  <path d="M 120 150 Q 180 145 240 160" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
  <text x="140" y="135" fill="#64748b" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Clavicle</text>
  
  <!-- Scapula (Rotated by 30 degrees) -->
  <g transform="translate(240, 160) rotate(30)">
    <!-- Scapula body representation -->
    <path d="M 0 0 L -30 120 L -90 90 Z" fill="url(#greenGrad)" opacity="0.85" stroke="#22c55e" stroke-width="2" />
    <!-- Acromion process -->
    <path d="M 0 0 Q 15 -15 30 -5" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
    <text x="-40" y="60" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Scapula</text>
    <text x="-40" y="75" fill="#4ade80" font-family="monospace" font-weight="bold" font-size="10">+30° Upward Rot.</text>
  </g>
  
  <!-- Humerus (Rotated by 90 degrees total, 60 relative to scapula) -->
  <g transform="translate(240, 160) rotate(90)">
    <!-- Humerus bone shaft -->
    <rect x="-10" y="10" width="20" height="180" rx="10" fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="2" />
    <!-- Humeral head -->
    <circle cx="0" cy="5" r="18" fill="#e2e8f0" />
    <text x="25" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Humerus</text>
    <text x="25" y="115" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="10">+60° Abduction</text>
  </g>
  
  <!-- Glenohumeral Joint Center Anchor -->
  <circle cx="240" cy="160" r="6" fill="#f43f5e" />
  <circle cx="240" cy="160" r="12" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="2,2" />
  
  <!-- Arc 1: Scapular Rotation (30 deg) -->
  <path d="M 280 160 A 40 40 0 0 1 274.6 180" fill="none" stroke="#22c55e" stroke-width="3" />
  <text x="290" y="185" fill="#22c55e" font-family="monospace" font-weight="extrabold" font-size="12">1° Scapular Rot. (30°)</text>

  <!-- Arc 2: Humeral Abduction (60 deg) -->
  <path d="M 240 220 A 60 60 0 0 1 180 160" fill="none" stroke="#38bdf8" stroke-width="3" />
  <text x="110" y="240" fill="#38bdf8" font-family="monospace" font-weight="extrabold" font-size="12">2° Glenohumeral (60°)</text>

  <!-- Core Metric Highlights Card -->
  <rect x="360" y="270" width="210" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="380" y="300" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">TOTAL ELEVATION: 90°</text>
  
  <rect x="380" y="315" width="170" height="2" fill="#334155" />
  
  <text x="380" y="340" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Glenohumeral (GH) Joint:</text>
  <text x="380" y="358" fill="#f8fafc" font-family="monospace" font-weight="bold" font-size="14">60° (66.6% of movement)</text>

  <text x="380" y="385" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11">Scapulothoracic (ST) Joint:</text>
  <text x="380" y="403" fill="#f8fafc" font-family="monospace" font-weight="bold" font-size="14">30° (33.3% of movement)</text>
</svg>
